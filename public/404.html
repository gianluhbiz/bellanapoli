<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Pagina non trovata · Pizzeria Bella Napoli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1rem; padding: 2rem 1.25rem; text-align: center; background: #1d1714; color: #f4ece0;
        font-family: "Instrument Sans", system-ui, sans-serif;
      }
      img { width: min(60vw, 14rem); aspect-ratio: 4/5; object-fit: cover;  }
      p.k { font-weight: 600; font-size: .75rem; letter-spacing: .25em; text-transform: uppercase; color: #c4321f; margin-top: 1.5rem; }
      h1 { font-family: "Gloock", Georgia, serif; font-weight: 400; font-size: clamp(2.4rem, 7vw, 4.5rem); line-height: .95; max-width: 40rem; }
      p.s { color: rgba(244,236,224,.6); max-width: 28rem; }
      a { display: inline-flex; align-items: center; min-height: 3.25rem; padding: 0 1.75rem; margin-top: 1rem; border-radius: 3px; background: #c4321f; text-transform: uppercase; letter-spacing: .14em; font-size: .8rem; color: #f4ece0; font-weight: 600; text-decoration: none; }
      a:active { transform: scale(.97); }
    </style>
  </head>
  <body>
    <img src="/img/forno-bocca.webp" alt="Il forno a legna acceso" />
    <p class="k">Errore 404</p>
    <h1>Questa pagina non è uscita dal forno.</h1>
    <p class="s">Il link è sbagliato o la pagina non esiste più.</p>
    <a href="/">Torna alla home</a>
  </body>
</html>
